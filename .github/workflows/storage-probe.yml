name: Storage probe (temporary)

# Throwaway, for the Wails 3 branch only: does an update keep what the released
# application stored? Runs the last Wails 2 release, then this branch's build, on
# the same profile, and shows where each one's web storage went.

on:
  push:
    branches: [wails/v3]

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset: SnmpLens-linux-amd64.tar.gz
          - os: macos-latest
            asset: SnmpLens-macos-universal.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev xvfb
      - name: Build this branch
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
          node tools/build.mjs --version v9.9.9
      - name: Fetch the last Wails 2 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir old
          gh release download v1.7.0 -p '${{ matrix.asset }}' -D old
          cd old
          case '${{ matrix.asset }}' in
            *.zip) ditto -x -k ./*.zip . ;;
            *) tar -xzf ./*.tar.gz ;;
          esac
      - name: Run one, then the other
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            OLD=old/SnmpLens; NEW=build/bin/SnmpLens; WRAP="xvfb-run -a"; WHERE="$HOME/.local/share $HOME/.cache"
          else
            OLD=old/SnmpLens.app/Contents/MacOS/SnmpLens; NEW=build/bin/SnmpLens.app/Contents/MacOS/SnmpLens; WRAP=""; WHERE="$HOME/Library/WebKit $HOME/Library/Caches $HOME/Library/HTTPStorages"
          fi
          list() { for d in $WHERE; do find "$d" -type f 2>/dev/null; done | grep -iE 'snmplens|wails|localstorage|LocalStorage|storage' | sort; }
          run() { # name binary
            $WRAP "$2" > "$1.log" 2>&1 & pid=$!
            sleep 30
            kill "$pid" 2>/dev/null || true
            sleep 3
            pkill -f SnmpLens || true
            sleep 2
            echo "--- $1: what the page asked of Go"
            grep -E 'Loading [0-9]+ MIBs|panic|fatal' "$1.log" | head -5 || true
            echo "--- $1: last lines"
            tail -5 "$1.log" | cut -c1-200
          }
          run old "$OLD"
          list > old.files
          echo "=== files after the old release"; cat old.files
          for f in $(cat old.files); do [ -f "$f" ] && md5sum "$f" 2>/dev/null || md5 -r "$f"; done > old.sums || true
          sleep 2
          run new "$NEW"
          list > new.files
          echo "=== files the new build added"; comm -13 old.files new.files
          echo "=== files the new build changed"
          for f in $(cat old.files); do [ -f "$f" ] && { md5sum "$f" 2>/dev/null || md5 -r "$f"; }; done > new.sums || true
          diff old.sums new.sums | grep '^>' || echo "(none)"
