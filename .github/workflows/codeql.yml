name: CodeQL

# Static analysis for the code itself, which nothing else here does: go vet and
# staticcheck look for mistakes, govulncheck looks for known vulnerable
# dependencies, and neither goes looking for an exploitable pattern in code we
# wrote. The weekly run matters as much as the per-push one — a query added to
# CodeQL after a commit lands would otherwise never see it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

# A pull request pushed to again has its previous analysis cancelled; main and
# the weekly run are never cancelled, since each is the verdict on a commit.
concurrency:
  group: codeql-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      # Only this job may write findings; everything else stays read-only.
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The packages come from the Actions cache CI fills, not the mirror —
      # this step was the one that took 24 minutes on a slow day, after every
      # other check had finished. .github/linux-deps.sh says why that is safe
      # here and not in release.yml.
      - name: Identify the runner image
        id: image
        if: matrix.language == 'go'
        run: echo "version=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: Cache Linux packages
        if: matrix.language == 'go'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-debs
          key: linux-deps-${{ steps.image.outputs.version }}-${{ hashFiles('.github/linux-deps.sh') }}

      - name: Install Linux dependencies
        if: matrix.language == 'go'
        run: bash .github/linux-deps.sh

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      # main.go carries `//go:embed all:frontend/dist`, and frontend/dist is
      # produced by `wails build` and gitignored — so a plain `go build` fails
      # with "pattern all:frontend/dist: no matching files found" before a single
      # query runs. That is why this job failed on every push and every pull
      # request, and why thirteen Dependabot PRs all showed two red checks that
      # had nothing to do with the dependency they bumped.
      #
      # A placeholder rather than a real frontend build: CodeQL analyses the Go
      # code, not the bytes the binary embeds, so `npm ci && npm run build` would
      # cost two minutes to produce something no query looks at. The
      # javascript-typescript leg analyses the frontend SOURCE, which is what
      # matters there.
      - name: Placeholder for the embedded frontend
        if: matrix.language == 'go'
        run: |
          mkdir -p frontend/dist
          echo '<!-- CodeQL placeholder -->' > frontend/dist/index.html

      # The Go analysis needs a real build. Autobuild would not know about the
      # webkit2_41 tag, and would analyse a subset of the tree without saying so.
      - name: Build Go
        if: matrix.language == 'go'
        run: go build -tags webkit2_41 ./...

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
