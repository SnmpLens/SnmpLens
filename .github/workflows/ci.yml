name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The default GITHUB_TOKEN permissions are broader than a build needs. Declared
# explicitly so the workflow does not inherit whatever the repository settings
# grant.
permissions:
  contents: read

# Superseded pushes to the same pull request are pointless work. Pushes to main
# are never cancelled: every commit on the default branch gets its own verdict.
#
# Which is why a push is a group of its OWN, by commit. One group for main did
# not cancel the running push, but a group holds one run waiting and a newer
# one replaces it: of the last sixty pushes to main, twelve were cancelled that
# way while waiting, and those commits never had a verdict at all.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The full application build AND the Go tests, on every platform we ship.
  #
  # The tests used to run on Linux alone, "to avoid redundant runs". They are
  # not redundant: pkg/autostart writes an HKCU Run key on Windows, a LaunchAgent
  # on macOS and an XDG desktop entry on Linux; pkg/secrets is DPAPI, the
  # Keychain and a file backend; pkg/network runs traceroute6 on macOS and
  # tracert on Windows. Each of those is three implementations behind one
  # interface, and only one of them was ever exercised. The trap listener race
  # fixed in facaabe reproduced on Linux and never on Windows — the converse is
  # just as possible, and would have been just as invisible.
  build:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux/amd64
          - os: windows-latest
            platform: windows/amd64
          - os: macos-latest
            platform: darwin/universal

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A Windows runner's workspace is on D:, and Go keeps its caches and the
      # test binaries it links on C: unless told otherwise. Measured against a
      # baseline: the job went from 221 s to 122 s, the cache restore from 45 s
      # to 13 s, and the tests of internal/app and pkg/storage from 103 and
      # 76 s to 46 and 21 s. Set first, so `go env` gives the cache steps the
      # paths on D:.
      - name: "Put Go's work on D:"
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p /d/go-tmp
          echo 'GOCACHE=D:\go-build' >> "$GITHUB_ENV"
          echo 'GOMODCACHE=D:\go-mod' >> "$GITHUB_ENV"
          echo 'GOTMPDIR=D:\go-tmp' >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # From go.mod, so the toolchain has exactly one source of truth.
          go-version-file: go.mod
          # Its own cache is off; the Go caches are restored below.
          cache: false

      # The Go caches are this JOB's, not setup-go's. setup-go keys them by OS
      # and go.sum alone, so every job on one OS shares one entry, written by
      # whichever finished first: the race-instrumented test build restored
      # the security job's plain one and compiled everything again. Here each
      # job keeps its own, saved by pushes to main and restored by pull
      # requests from the newest one.
      - name: Locate the Go caches
        id: gopaths
        shell: bash
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - name: Restore the Go caches
        id: gocache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.gopaths.outputs.build }}
            ${{ steps.gopaths.outputs.mod }}
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-${{ github.job }}-

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Vite 8 requires ^20.19 || >=22.12. Pinning the major to 22 rather
          # than 20 keeps that satisfied instead of depending on which 20.x the
          # runner happens to resolve that day.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The packages come from the Actions cache when it holds them, not the
      # mirror; .github/linux-deps.sh says why, and why release.yml does not.
      - name: Identify the runner image
        id: image
        if: runner.os == 'Linux'
        run: echo "version=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: Cache Linux packages
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-debs
          key: linux-deps-${{ steps.image.outputs.version }}-${{ hashFiles('.github/linux-deps.sh') }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: bash .github/linux-deps.sh

      - name: Install Wails CLI
        # Pinned to the version in go.mod. The CLI generates the bridge bindings
        # and drives the build, so letting it float means a future release can
        # change the output — or drift from the library it generates against —
        # with nothing in this repository changing. The release workflow pins
        # the same version.
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0

      # Deliberately `wails build` and not a bare `go build`: the CLI
      # regenerates the JS bindings and builds the frontend before compiling, so
      # this is the only check covering the whole pipeline a release runs.
      # Without it CI can be green while `wails build` is broken, and the
      # breakage surfaces when a tag is pushed — which is to say, once it is
      # already a failed release.
      - name: Build
        shell: bash
        run: |
          TAGS=""
          if [ "$RUNNER_OS" = "Linux" ]; then TAGS="-tags webkit2_41"; fi
          wails build -platform ${{ matrix.platform }} $TAGS

      - name: Vet & test
        shell: bash
        # -race, because pkg/mib holds a package-wide lock around a library whose
        # "read" accessors mutate: internal.(*Object).GetSmiNode memoises on
        # first call. Two concurrent readers raced for as long as that lock was
        # an RWMutex, and nothing in CI could see it.
        #
        # -count=1 defeats the test cache. A cached PASS is a result from a
        # previous toolchain and a previous dependency set, reported as though
        # this run had verified it.
        run: |
          TAGS=""
          if [ "$RUNNER_OS" = "Linux" ]; then TAGS="-tags webkit2_41"; fi
          go vet $TAGS ./...
          go test $TAGS -race -count=1 ./...

      - name: Save the Go caches
        if: always() && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.gopaths.outputs.build }}
            ${{ steps.gopaths.outputs.mod }}
          key: ${{ steps.gocache.outputs.cache-primary-key }}

  quality:
    name: Quality (lint, tests, tidy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The sitemap check derives <lastmod> from the commit that last
          # touched each page, so it needs the history. At the default depth of
          # 1 the single grafted commit looks like it changed every file, and
          # the dates come out as "today" for all seven — the tool refuses
          # rather than answer that, so without this the job fails.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # This job's own Go caches; the build job says why.
      - name: Locate the Go caches
        id: gopaths
        shell: bash
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - name: Restore the Go caches
        id: gocache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.gopaths.outputs.build }}
            ${{ steps.gopaths.outputs.mod }}
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-${{ github.job }}-

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The packages come from the Actions cache when it holds them, not the
      # mirror; .github/linux-deps.sh says why, and why release.yml does not.
      - name: Identify the runner image
        id: image
        run: echo "version=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: Cache Linux packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-debs
          key: linux-deps-${{ steps.image.outputs.version }}-${{ hashFiles('.github/linux-deps.sh') }}

      - name: Install Linux dependencies
        run: bash .github/linux-deps.sh

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      # The gate that keeps `npm run build` silent.
      #
      # The Svelte compiler emits accessibility and unused-CSS warnings and
      # never fails on them, so a build stays green while they accumulate — 42
      # of them had, until they were cleared. Verified rather than assumed:
      # removing one `role="presentation"` leaves `npm run build` at exit 0 and
      # takes this step to exit 1.
      #
      # `checkJs` is off in jsconfig.json, and that is what makes this usable:
      # with it on, the same command reports 1631 diagnostics on a codebase
      # written without annotations. See the comment there.
      - name: Svelte check
        run: npm run check
        working-directory: frontend

      # Compiles every component, fails on a name nothing declares and on a
      # rendered expression that depends on state it does not name — the two
      # things Svelte 5 stopped reporting. Also the locale parity check.
      - name: Frontend tests
        run: npm test
        working-directory: frontend

      # The MIB editor underlines a problem as a span around its characters;
      # what can still be wrong is WHICH characters, once Go's line and column
      # become an offset in a text with tabs, accented and wide characters
      # before the word. The hand-made surface before CodeMirror was wrong
      # three ways that passed every test above and were found by looking at
      # the screen. This loads the editor in Chrome and checks that every
      # underline holds exactly its word, where Go put it, before and after
      # scrolling.
      - name: Editor underlines land on their words
        run: |
          node tools/genbridge.mjs tools/screenshot-spec.json
          node tools/editorcheck.mjs

      # GitHub Pages serves the REPOSITORY, and there is no Pages build step, so
      # anything docs/*.html names has to be committed or it is a 404 on the live
      # site — while rendering perfectly on the machine that made it, because a
      # local preview reads the disk. That shipped once: an ignore rule for the
      # 3200 px captures swallowed two favicons, the touch icon and the
      # documentation social card.
      - name: Site assets are in the repository
        run: node tools/check-assets.mjs

      # The sitemap states its own rule — "bump lastmod in the same commit that
      # edits a page; a date that never moves is worse than no date at all,
      # because it is believed once and then discounted" — and nothing enforced
      # it, so changelog.html drifted a day behind within one release. The dates
      # are derived from git rather than typed, and a lie fails here.
      - name: Sitemap dates match git
        run: node tools/sitemap-lastmod.mjs --check

      # One action, one SHA -- and pinned by commit, never by tag.
      #
      # codeql-action/init writes a configuration file that codeql-action/analyze
      # reads back, and the two compare versions, so a bump moving one and not
      # the other ends on "Loaded a configuration file for version '4.38.1', but
      # running version '4.38.2'". Dependabot sees two `uses:` lines and raises
      # two pull requests; each is red on its own and green on everything else,
      # which reads as a flaky upgrade rather than a pair that cannot be split.
      # It happened at 4.37.9 to 4.38.0 and again at 4.38.1 to 4.38.2.
      #
      # It does NOT check that a pin is the newest release. That is Dependabot's
      # job, and a check failing because something newer exists is a check that
      # fails on a commit which changed nothing.
      - name: Action pins move together
        run: node tools/actionpins.mjs

      # main.go carries `//go:embed all:frontend/dist`, and frontend/dist is
      # gitignored, so anything compiling the main package fails with
      # "pattern all:frontend/dist: no matching files found" before it analyses a
      # line. A placeholder rather than a real frontend build: no analyser here
      # inspects the bytes the binary embeds, and the build job already compiles
      # the real thing on all three platforms.
      - name: Placeholder for the embedded frontend
        run: |
          mkdir -p frontend/dist
          echo '<!-- CI placeholder -->' > frontend/dist/index.html

      - name: Staticcheck
        # PINNED, and with the build tag. Two separate points.
        #
        # Pinned because a linter that floats can fail a commit that changed
        # nothing, when a newly added check fires. The finding may well be real,
        # but it should arrive in its own deliberate bump rather than as a
        # surprise on someone else's pull request. Dependabot does not track
        # versions inside a `run:` step, so this is bumped by hand.
        #
        # Tagged because without -tags webkit2_41 the Wails-dependent code is
        # not built on Linux and therefore not analysed — the check would pass
        # by not looking.
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          staticcheck -tags webkit2_41 ./...

      - name: go.mod is tidy
        # A stale go.mod/go.sum means the dependency set CI resolves is not the
        # one recorded in the repository, so every other check here verifies
        # something slightly different from what a release builds.
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Save the Go caches
        if: always() && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.gopaths.outputs.build }}
            ${{ steps.gopaths.outputs.mod }}
          key: ${{ steps.gocache.outputs.cache-primary-key }}

  # Blocks a pull request that introduces a dependency carrying a known
  # advisory. govulncheck cannot do this: it reports on what is already merged.
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  security:
    name: Security audit
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # This job's own Go caches; the build job says why.
      - name: Locate the Go caches
        id: gopaths
        shell: bash
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - name: Restore the Go caches
        id: gocache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.gopaths.outputs.build }}
            ${{ steps.gopaths.outputs.mod }}
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-${{ github.job }}-

      # No npm cache: nothing here installs the frontend, and npm audit reads
      # the lockfile.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # The packages come from the Actions cache when it holds them, not the
      # mirror; .github/linux-deps.sh says why, and why release.yml does not.
      - name: Identify the runner image
        id: image
        run: echo "version=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: Cache Linux packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-debs
          key: linux-deps-${{ steps.image.outputs.version }}-${{ hashFiles('.github/linux-deps.sh') }}

      - name: Install Linux dependencies
        run: bash .github/linux-deps.sh

      - name: Placeholder for the embedded frontend
        run: |
          mkdir -p frontend/dist
          echo '<!-- CI placeholder -->' > frontend/dist/index.html

      # THE TRIPWIRE, and it is not ceremony.
      #
      # govulncheck's analysis is only as complete as the packages it manages to
      # load, and it does not fail when one of them does not build: it reports on
      # the rest and prints a clean bill of health. This job had neither the
      # placeholder above nor these GTK/WebKit headers, so on Linux the main
      # package dropped out of every scan it ever ran. Reproduced locally by
      # removing frontend/dist: `go build ./...` fails with the embed error while
      # `govulncheck ./...` answers "No vulnerabilities found" and exits 0.
      #
      # This step fails loudly if the toolchain cannot compile what the next one
      # is supposed to analyse.
      - name: Confirm the tree builds before scanning it
        run: go build -tags webkit2_41 ./...

      - name: Go vulnerability check
        # Reports only vulnerabilities in code paths the binary actually calls,
        # standard library included.
        #
        # Deliberately @latest, unlike staticcheck above: the point of this step
        # is to know about advisories published since the last commit, and an old
        # scanner reports an old world. A new finding here means a real new
        # advisory, not a new opinion about existing code.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck -tags webkit2_41 ./...

      # `|| true` made this decoration: it reported and never failed, so a
      # critical advisory in a shipped dependency would have gone unnoticed.
      # High and above now fails; anything genuinely unfixable belongs in an
      # explicit, documented dismissal rather than a swallowed exit code.
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend

      - name: Save the Go caches
        if: always() && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.gopaths.outputs.build }}
            ${{ steps.gopaths.outputs.mod }}
          key: ${{ steps.gocache.outputs.cache-primary-key }}
