version: 2

# Dependabot is what makes SHA-pinned actions maintainable. Pinning without it
# means the pins rot: an action stays frozen at whatever commit was current the
# day someone wrote it, security fixes included.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # golang.org/x/* move together and are almost always safe; one PR rather
      # than five keeps the noise down without hiding anything.
      golang-x:
        patterns:
          - golang.org/x/*

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # The workflows pin actions by commit SHA, so this is the only thing that
  # ever moves them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # init writes a configuration file that analyze reads back and refuses
      # when the versions differ. Ungrouped, every release arrived as two pull
      # requests, each red on its own and fixed only by a third written by hand
      # — four times, from 4.38.0 to 4.39.0. tools/actionpins.mjs fails when an
      # action used under several paths is not covered by one pattern here.
      codeql-action:
        patterns:
          - github/codeql-action*
      # actions/cache, actions/cache/restore and actions/cache/save are one
      # action at one version, which tools/actionpins.mjs requires.
      actions-cache:
        patterns:
          - actions/cache*
